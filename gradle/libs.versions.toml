[versions]
# Pinned to the same combination Go and Chess+ ship with, which is known to
# build and run on the Kompakt. Newer is not better here: MMD 1.0.2 is the design
# system the phone's own apps use, and it constrains the Compose version.
agp = "8.13.1"
kotlin = "2.2.21"
mmd = "1.0.2"
room = "2.8.4"

androidx-activity = "1.12.0"
androidx-core = "1.17.0"
androidx-lifecycle = "2.10.0"
androidx-compose = "1.9.5"
androidx-material3 = "1.4.0"

junit = "4.13.2"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidx-compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-material3" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "androidx-compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "androidx-compose" }

mmd = { module = "com.mudita:MMD", version.ref = "mmd" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version = "1.6.1" }
robolectric = { module = "org.robolectric:robolectric", version = "4.14.1" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.10.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# KSP versions are pinned to an exact Kotlin release; 2.2.21-2.0.5 is the pairing
# for Kotlin 2.2.21. Bumping Kotlin without bumping this in step will not build.
ksp = { id = "com.google.devtools.ksp", version = "2.2.21-2.0.5" }
