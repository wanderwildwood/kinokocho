name: Bug report
description: Something in the app does not work.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Anything that loses a journal entry or a photograph is the most important kind of
        bug here, and so is anything that makes the app look like it is deciding. Say so
        plainly if that is what happened.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: checkboxes
    id: severity
    attributes:
      label: Did it lose anything
      options:
        - label: A journal entry, a photograph, or a recorded character was lost
        - label: The app presented something as decided rather than as not ruled out
  - type: input
    id: version
    attributes:
      label: App version
      description: On the journal screen, the ⓘ button.
      placeholder: "0.3.2"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Mudita Kompakt, Android 12
