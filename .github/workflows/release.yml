name: Release

on:
  push:
    tags:
      - 'v*'
  # Also startable by hand: a tag push can take a long time to produce a run, long enough
  # to look like the push did nothing, and this gives a way to retry one that failed
  # halfway without deleting and re-pushing the tag.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # This repo has no checked-in fallback key, so without the secret the build would
      # produce an unsigned release rather than a wrongly-signed one. Fail either way.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set - refusing to build an unsigned release."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/signing.keystore
          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > signing/signing.properties

      # The pack is the part of this app that can be wrong in a way that hurts somebody,
      # and the tests that guard it are cheap. They run before anything is built.
      - name: Test
        run: ./gradlew :app:testDebugUnitTest

      # Every drawing and the whole taxon pack are generated, and a generated file that
      # has been hand-edited is a file that will be overwritten one day without anyone
      # noticing. Regenerate and require the tree to come back unchanged.
      # Both of the generator's outputs, not just one. make-art.py writes the drawables
      # *and* CharacterArt.kt, which carries the exemplar species named under each
      # drawing — and only the drawables were checked, so the Kotlin was a generated file
      # with nothing watching it, which is the exact thing this step exists to prevent.
      # It went stale the first time a taxon was renamed.
      - name: Check the generated art is what the generator produces
        run: |
          python3 tools/make-art.py
          generated="app/src/main/res app/src/main/kotlin/com/wanderwildwood/kinokocho/ui/CharacterArt.kt"
          if ! git diff --quiet -- $generated; then
            echo "::error::The checked-in drawings differ from what tools/make-art.py produces."
            git diff --stat -- $generated
            exit 1
          fi

      # The iNaturalist application id is not in this repository and has no default, so
      # a build without it produces an app with no publishing button at all. That is the
      # right outcome for a fork and the wrong one to ship by accident, so which of the
      # two happened is said out loud in the log rather than left to be discovered by
      # installing it. Set INAT_CLIENT_ID as a repository secret to turn publishing on.
      # It is not a secret in the cryptographic sense - a PKCE client id cannot be - it
      # is kept out of the tree because it is an identity.
      - name: Build release APK
        env:
          INAT_CLIENT_ID: ${{ secrets.INAT_CLIENT_ID }}
        run: |
          if [ -n "$INAT_CLIENT_ID" ]; then
            echo "Building with iNaturalist publishing enabled."
            ./gradlew :app:assembleRelease -PinatClientId="$INAT_CLIENT_ID"
          else
            echo "::warning::INAT_CLIENT_ID is not set - this release cannot publish to iNaturalist."
            ./gradlew :app:assembleRelease
          fi

      # Signed with the wrong key is not something that can be taken back once people have
      # installed it, and gradle prints BUILD SUCCESSFUL for an unsigned APK just as
      # happily. So the check is positive: it asserts this exact certificate rather than
      # looking for a particular wrong one.
      - name: Verify the signing certificate
        env:
          EXPECTED: d08ec862513896a11d962c283dfb7c004c4fbfff3382bba4aaea1411c2c5b6e7
        run: |
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk')
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          digest=$(echo "$certs" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]+' | awk '{print $NF}')
          if [ -z "$digest" ]; then
            echo "::error::Could not read a signing certificate - refusing to release unchecked."
            exit 1
          fi
          if [ "$digest" != "$EXPECTED" ]; then
            echo "::error::APK is signed with $digest, expected $EXPECTED."
            exit 1
          fi

      - name: Check the version matches the tag
        run: |
          version=$(grep -m1 'versionName = ' app/build.gradle.kts | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::versionName is $version but the tag says $tag."
            exit 1
          fi

      # Two copies of the same APK go up. The versioned name is what people end up with
      # in their downloads folder and what a checksum posted anywhere refers to; the
      # unversioned one exists so that
      #   .../releases/latest/download/kinokocho.apk
      # is a link that keeps working after the next release, which a versioned link does
      # not. Both are byte-identical - only the file name differs.
      - name: Rename APK and generate checksum
        run: |
          apk_name="kinokocho-${GITHUB_REF_NAME}.apk"
          apk_path=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk')
          cp "$apk_path" "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"
          cp "$apk_path" kinokocho.apk
          sha256sum kinokocho.apk > kinokocho.apk.sha256

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # kinokocho-*.apk does not match kinokocho.apk, so the fixed-name pair is listed.
          files: |
            kinokocho-*.apk
            kinokocho-*.apk.sha256
            kinokocho.apk
            kinokocho.apk.sha256
          # No body_path. The standing description of the app lives in the README, and
          # stamping it over every release body buries the news under it — the Go repo
          # published thirteen notes out of thirty-two that said nothing about what had
          # changed. What CI writes is the changelog; the note itself is written by hand
          # afterwards with `gh release edit`.
          generate_release_notes: true
